name: Auto refresh revenue intelligence

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync source files from reporting preview
        run: python3 scripts/sync_sources.py

      - name: Build data layer
        env:
          REVENUE_SOURCE_DIR: source/current
        run: python3 scripts/build_snapshot.py

      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/current data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Auto refresh revenue intelligence data"
          git push
